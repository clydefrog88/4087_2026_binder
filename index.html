<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5fa" />
    <meta name="description" content="Team 4087 Voodoo Voltage technical binder: robot design, CAD, fabrication, and season." />
    <link rel="icon" type="image/png" href="%BASE_URL%logo-icon.png" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a light flash.
      try {
        var t = localStorage.getItem('theme');
        if (!t && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
        if (t === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
    <title>4087 Voodoo Voltage | Technical Binder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
